name: HattrickAI V5 Build

on:
  push:
    branches: [v5]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore V5
        run: dotnet restore HattrickAI_V5/HattrickAI.V5.csproj
      - name: Build V5
        run: dotnet build HattrickAI_V5/HattrickAI.V5.csproj --configuration Release --no-restore
      - name: Publish V5
        run: dotnet publish HattrickAI_V5/HattrickAI.V5.csproj --configuration Release --no-restore --output /tmp/v5-publish
      - name: Build Docker image
        run: docker build --pull -t hattrickai-v5:ci -f HattrickAI_V5/Dockerfile .
