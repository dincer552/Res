name: HattrickAI V5 Deploy

on:
  push:
    branches: [v5]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout V5
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build --pull -t hattrick-v5:latest -f HattrickAI_V5/Dockerfile .

      - name: Replace running container
        run: |
          docker rm -f hattrick-v5 || true
          docker run -d \
            --name hattrick-v5 \
            --restart unless-stopped \
            -p 10000:10000 \
            hattrick-v5:latest

      - name: Verify deployment
        run: |
          sleep 5
          docker ps --filter name=hattrick-v5
          curl --fail http://127.0.0.1:10000
