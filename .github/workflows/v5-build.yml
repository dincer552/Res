name: HattrickAI V5 Deploy

on:
  push:
    branches: [v5]
  workflow_dispatch:

# Azure VM tek deploy hedefi olduğu için aynı anda birden fazla deploy
# çalışmasına izin verme. Yeni commit geldiğinde eski deploy iptal edilir.
concurrency:
  group: v5-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout V5
        uses: actions/checkout@v4

      # Geçici olarak durduruldu. Regression testleri daha sonra yeniden
      # aktif etmek için if koşulunu true yap.
      - name: Offline acceptance regression (PAUSED)
        if: ${{ false }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "🧪 V5 offline acceptance regression C12'den başlıyor..."
          dotnet run --project HattrickAI_V5.OfflineTests/HattrickAI_V5.OfflineTests.csproj -- c12 TestJSON/HattrickAI_V5_CHPP_FullOffline_2026-09-01.json
          echo "✅ V5 offline acceptance regression tamamlandı"

      - name: Build Docker image
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "📦 Docker build başlıyor..."
          docker build --pull \
            --build-arg BUILD_SHA="${GITHUB_SHA}" \
            -t hattrick-v5:deploy \
            -f HattrickAI_V5/Dockerfile .
          echo "✅ Docker build tamamlandı"
          echo "🔖 Build SHA: ${GITHUB_SHA:0:7}"

      - name: Save Docker image
        shell: bash
        run: |
          set -Eeuo pipefail
          ARCHIVE="hattrick-v5-${GITHUB_SHA}.tar.gz"
          echo "💾 Docker image paketleniyor: ${ARCHIVE}"
          docker save hattrick-v5:deploy | gzip > "${ARCHIVE}"
          echo "✅ Image hazır:"
          ls -lh "${ARCHIVE}"

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          DEPLOY_HOST="${{ secrets.DEPLOY_HOST }}"
          DEPLOY_USER="${{ secrets.DEPLOY_USER }}"
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          test -s ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          ssh-keyscan -T 10 -p 22 -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" "echo SSH_OK"
          echo "✅ SSH hazır ve azureuser bağlantısı doğrulandı"

      - name: Upload Docker image
        shell: bash
        run: |
          set -Eeuo pipefail
          ARCHIVE="hattrick-v5-${GITHUB_SHA}.tar.gz"
          REMOTE_ARCHIVE="/tmp/${ARCHIVE}"
          echo "📤 Docker image Azure VM'ye gönderiliyor: ${REMOTE_ARCHIVE}"
          scp -i ~/.ssh/deploy_key "${ARCHIVE}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${REMOTE_ARCHIVE}.upload"
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "mv '${REMOTE_ARCHIVE}.upload' '${REMOTE_ARCHIVE}'"
          echo "✅ Image Azure VM'ye gönderildi"

      - name: Deploy on Azure VM
        shell: bash
        run: |
          set -Eeuo pipefail
          ARCHIVE="hattrick-v5-${GITHUB_SHA}.tar.gz"
          REMOTE_ARCHIVE="/tmp/${ARCHIVE}"
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" << EOF
          set -Eeuo pipefail
          LOG_DIR="/home/azureuser/hattrick-deploy"
          LOG_FILE="\$LOG_DIR/deploy.log"
          REMOTE_ARCHIVE="${REMOTE_ARCHIVE}"
          mkdir -p "\$LOG_DIR"
          touch "\$LOG_FILE"
          log() { printf '[%s] %s\n' "\$(date '+%Y-%m-%d %H:%M:%S')" "\$1" >> "\$LOG_FILE"; }
          trap 'rc=$?; log "❌ DEPLOY FAILED (exit code \$rc)"; exit \$rc' ERR
          log "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          log "🚀 GitHub deploy başladı"
          log "Branch: ${GITHUB_REF_NAME}"
          log "Commit: ${GITHUB_SHA:0:7}"
          log "Gönderen: ${GITHUB_ACTOR}"
          log "📦 Image: hattrick-v5:deploy"
          log "📥 Docker image yükleniyor: \$REMOTE_ARCHIVE"
          test -s "\$REMOTE_ARCHIVE"
          gunzip -c "\$REMOTE_ARCHIVE" | sudo docker load
          log "✅ Docker image yüklendi"
          log "🛑 Eski container durduruluyor..."
          sudo docker rm -f hattrick-v5 2>/dev/null || true
          log "▶️ Yeni container başlatılıyor..."
          sudo docker run -d --name hattrick-v5 --restart unless-stopped -p 10000:10000 -e CHPP_CONSUMER_SECRET="${{ secrets.CHPP_CONSUMER_SECRET }}" -v "\$LOG_FILE:/app/deploy.log:ro" hattrick-v5:deploy
          log "⏳ Health check bekleniyor..."
          sleep 5
          if sudo docker ps --filter "name=hattrick-v5" --filter "status=running" | grep -q hattrick-v5; then
            log "✅ Container çalışıyor"
          else
            log "❌ Container başlamadı"
            sudo docker logs hattrick-v5 >> "\$LOG_FILE" 2>&1 || true
            exit 1
          fi
          health="\$(curl --fail --silent --show-error http://127.0.0.1:10000/health)"
          log "❤️ Health: \$health"
          log "🟢 DEPLOY BAŞARILI"
          log "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          rm -f "\$REMOTE_ARCHIVE"
          sudo docker image prune -f
          EOF

      - name: Deployment completed
        run: echo "🟢 V5 deployment completed successfully"
